<!doctype html>
<html lang="zh-CN"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>营养素消化 · 对错大挑战</title>
  <style>
    :root{--ink:#14233b;--muted:#6e7c91;--paper:#fffdf8;--line:#e7e8ec;--accent:#b51e32;--accent2:#f6c15b;--ok:#2f9b6a;--bad:#c85b50;--shadow:0 18px 60px #16233b16;--radius:24px}
    *{box-sizing:border-box} body{margin:0;background:#f3f5f8;color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","PingFang SC",system-ui,sans-serif;min-height:100vh}
    button{font:inherit;border:0;cursor:pointer} .app{min-height:100vh;display:flex;justify-content:center;padding:28px 18px 112px}.shell{width:min(1060px,100%);position:relative}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px}.crest{width:45px;height:45px;display:grid;place-items:center;border-radius:14px;background:var(--accent);color:white;font-weight:900;letter-spacing:-2px;box-shadow:0 8px 20px #b51e3235}.brand b{font-size:15px}.brand span{display:block;color:var(--muted);font-size:11px;margin-top:2px}.tag{font-size:12px;color:var(--accent);background:#fff0ee;border-radius:99px;padding:9px 13px;font-weight:700}
    .hero{display:grid;grid-template-columns:1.06fr .94fr;gap:24px;align-items:stretch}.hero-copy,.hero-art,.game-card,.result-card{background:var(--paper);border:1px solid #fff;box-shadow:var(--shadow);border-radius:var(--radius)}.hero-copy{padding:48px 44px;display:flex;flex-direction:column;justify-content:center;min-height:400px}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin-bottom:15px}.hero h1{font-size:clamp(36px,5vw,62px);letter-spacing:-.06em;line-height:1.03;margin:0 0 18px}.hero h1 em{font-style:normal;color:var(--accent)}.hero p{color:var(--muted);line-height:1.8;margin:0 0 25px;font-size:15px}.meta{display:flex;gap:9px;flex-wrap:wrap}.meta span{background:#f2f3f5;padding:8px 11px;border-radius:10px;font-size:12px;color:#56657b}.primary{background:var(--accent);color:#fff;padding:15px 22px;border-radius:13px;font-weight:800;box-shadow:0 10px 22px #b51e3230;transition:.2s}.primary:hover{transform:translateY(-2px);filter:brightness(1.05)}.secondary{background:#f3f5f8;color:var(--ink);padding:13px 18px;border-radius:12px;font-weight:700}
    .hero-art{position:relative;overflow:hidden;min-height:400px;background:linear-gradient(145deg,#b51e32 0%,#7f1728 100%);color:#fff;padding:34px}.hero-art:before,.hero-art:after{content:"";position:absolute;border:1px solid #ffffff33;border-radius:50%;width:370px;height:370px;right:-100px;top:-85px}.hero-art:after{width:220px;height:220px;right:85px;top:90px}.art-label{font-size:12px;letter-spacing:.14em;opacity:.75}.art-title{font-size:30px;line-height:1.2;font-weight:900;max-width:240px;margin-top:12px;position:relative;z-index:1}.orbit{position:absolute;inset:0;display:grid;place-items:center}.molecule{position:relative;width:180px;height:180px;border:2px dashed #ffffff70;border-radius:50%;z-index:1}.molecule:before,.molecule:after{content:"";position:absolute;background:var(--accent2);border-radius:50%;box-shadow:0 0 0 9px #f6c15b25}.molecule:before{width:75px;height:75px;left:52px;top:52px}.molecule:after{width:25px;height:25px;right:-10px;top:28px}.atom{position:absolute;width:19px;height:19px;border-radius:50%;background:#ffdca0;box-shadow:0 0 0 7px #ffdca025}.a1{left:-9px;top:75px}.a2{right:28px;bottom:-9px}.a3{left:26px;bottom:14px}.art-foot{position:absolute;bottom:28px;font-size:12px;opacity:.8}
    .game{display:none}.game-card{padding:32px;max-width:760px;margin:0 auto}.game-head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:28px}.progress-wrap{flex:1}.progress-label{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:9px}.progress{height:8px;background:#edf0f3;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:.35s}.score{background:#fff3e6;color:#9b5c10;border-radius:12px;padding:11px 13px;font-weight:800;font-size:13px}.question-kicker{color:var(--accent);font-size:12px;font-weight:800;margin-bottom:10px}.question{font-size:clamp(24px,4vw,38px);letter-spacing:-.045em;line-height:1.25;margin:0 0 25px}.answers{display:grid;gap:12px}.answer{display:flex;align-items:center;gap:13px;background:#f7f8fa;border:1px solid transparent;border-radius:16px;padding:17px 16px;text-align:left;transition:.2s;color:var(--ink)}.answer:hover{border-color:#ddb0b5;background:#fff}.answer .letter{width:28px;height:28px;border-radius:9px;background:#fff;color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:900;flex:0 0 auto}.answer.selected{border-color:var(--accent);background:#fff5f3}.answer.correct{background:#eaf8f0;border-color:#7dc8a0}.answer.wrong{background:#fff0ed;border-color:#e5a39d}.answer.dim{opacity:.48}.feedback{display:none;margin-top:22px;border-radius:17px;padding:18px;background:#f5f7fa}.feedback.show{display:block}.feedback.ok{background:#eaf8f0}.feedback.bad{background:#fff1ed}.feedback h3{font-size:15px;margin:0 0 7px}.feedback p{font-size:13px;color:#59687e;line-height:1.7;margin:0}.feedback .next{margin-top:15px}.hint{margin-top:22px;color:var(--muted);font-size:12px;text-align:center}
    .result{display:none}.result-card{max-width:760px;margin:0 auto;padding:45px;text-align:center}.result-card .medal{font-size:58px;margin-bottom:12px}.result-card h2{font-size:38px;letter-spacing:-.06em;margin:0 0 10px}.result-card p{color:var(--muted);line-height:1.7}.result-score{color:var(--accent);font-size:54px;font-weight:900;margin:25px 0 4px}.result-actions{display:flex;gap:10px;justify-content:center;margin-top:25px;flex-wrap:wrap}.draw-box{display:none;max-width:500px;margin:20px auto 0;background:#fff7e8;padding:19px;border-radius:18px;color:#845e26}.draw-box.show{display:block}.draw-box b{display:block;margin-bottom:7px;color:#6d4615}.draw-box span{font-size:13px;line-height:1.6}
    .switcher{position:fixed;z-index:10;bottom:22px;left:50%;transform:translateX(-50%);background:#17243a;color:#fff;border-radius:99px;padding:8px 9px;display:flex;align-items:center;gap:11px;box-shadow:0 12px 30px #16233b33;font-size:12px}.switcher button{background:#ffffff18;color:#fff;border-radius:50%;width:28px;height:28px}.switcher button:hover{background:#ffffff30}.switcher strong{font-size:11px;letter-spacing:.03em;min-width:145px;text-align:center}.switcher small{display:block;color:#b5c1d1;font-weight:400;margin-top:2px}
    body.vB{--accent:#087f8c;--paper:#fbfffe;--accent2:#f4bc55;background:#eaf5f4}.vB .hero-art{background:linear-gradient(145deg,#087f8c,#095d6f)}.vB .hero-copy,.vB .game-card,.vB .result-card{border-radius:18px}.vB .hero-copy{min-height:400px}.vB .answer .letter{color:#087f8c}.vB .hero h1 em{color:#087f8c}.vB .tag{color:#087f8c;background:#daf2ef}.vB .hero{grid-template-columns:.8fr 1.2fr}.vB .hero-art{order:-1}

    body.vC .hero-art:before{background:#2e3a3440!important;border:0!important;border-radius:0}
    body.vC .hero-art:after{box-shadow:none!important;border:0!important;background:#fff7ea}
    body.vC .art-title{font-family:Literata,Georgia,serif;font-size:34px;font-weight:600;text-shadow:none}
    body.vC .art-label,.vC .art-foot{font-size:13px;letter-spacing:0;opacity:1}
    body.vC .art-note{border-radius:0;box-shadow:none!important;background:#fff6dc;color:#594a38;font-size:12px}
    body.vC .art-stamp{box-shadow:none!important;border-radius:0;background:#e3792c;color:#241a1b}
    body.vC .game{min-height:100svh;padding:120px 0}
    body.vC .game-card{max-width:780px;padding:0 0 30px;background:transparent;border:0;box-shadow:none!important;border-radius:0}
    body.vC .game-head{margin-bottom:64px}
    body.vC .progress{height:8px;border-radius:0;background:#ddcfbf}
    body.vC .progress i{border-radius:0;background:#e3792c}
    body.vC .score{border-radius:0;background:#402431;color:#fff}
    body.vC .question-kicker{font-family:Literata,Georgia,serif;font-size:15px;letter-spacing:0;color:#e3792c;font-style:italic}
    body.vC .question{font-family:Literata,Georgia,serif;font-size:clamp(34px,4.6vw,66px);line-height:1.04;font-weight:500;max-width:15ch}
    body.vC .answers{grid-template-columns:1fr 1fr;gap:12px}
    body.vC .answer{border-radius:0;border:0;background:#fffaf1;box-shadow:none!important;padding:19px 16px;transition:transform .2s ease,background .2s ease}
    body.vC .answer:hover{border:0;background:#f0e4d4;transform:translateY(-3px)}
    body.vC .answer .letter{border-radius:0;background:#402431;color:#fff}
    body.vC .answer.correct{background:#d7eadf}.vC .answer.wrong{background:#f0d3c9}
    body.vC .feedback{border-radius:0;background:#eadfce;box-shadow:none!important;border-left:7px solid #e3792c}
    body.vC .feedback.ok{background:#d7eadf;border-left-color:#286e52}.vC .feedback.bad{background:#f0d3c9;border-left-color:#a84135}
    body.vC .feedback p{font-size:16px;color:#201c1d}
    body.vC .hint{font-size:13px;color:#6b5c5d;text-align:left}
    body.vC .result{min-height:100svh;padding:150px 0}
    body.vC .result-card{max-width:780px;padding:56px;background:#fffaf1;border:0;border-radius:0;box-shadow:none!important;text-align:left}
    body.vC .result-card .medal{font-size:0}.vC .result-card .medal:after{content:"FIELD NOTE";font-size:13px;color:#e3792c;letter-spacing:.08em}
    body.vC .result-card h2{font-family:Literata,Georgia,serif;font-size:clamp(42px,6vw,76px);line-height:.95;font-weight:500}
    body.vC .result-card p{font-size:18px;color:#201c1d;max-width:38ch}
    body.vC .result-score{font-size:68px;color:#e3792c}.vC .draw-box{border-radius:0;background:#eadfce;color:#201c1d}.vC .draw-box b{color:#402431}
    body.vC .switcher{display:none}
    /* Final balance pass: content first, one restrained overlap */
    body.vC .question{font-size:clamp(28px,3.2vw,46px);line-height:1.13;max-width:18ch;letter-spacing:-.035em}
    body.vC .hero-art:after{display:none}
    body.vC .hero-copy:after{display:none}
    body.vC .art-stamp{right:16px;top:48px;transform:rotate(4deg);padding:9px 10px;font-size:10px}
    body.vC .art-note{left:16px;top:128px;transform:rotate(-2deg);width:156px;padding:12px 13px}
    body.vC .meta span:nth-child(2){transform:none}
